# Despliegue en Render (https://render.com): New → Blueprint → elegir este repositorio.
# Crea un servicio web desde el Dockerfile con un disco persistente para los proyectos.
services:
  - type: web
    name: cad2revit
    runtime: docker
    plan: starter            # el plan gratuito no admite disco persistente
    healthCheckPath: /salud
    envVars:
      - key: CAD2REVIT_CLAVE
        sync: false          # Render la pedirá al crear el servicio
    disk:
      name: datos
      mountPath: /datos
      sizeGB: 1
