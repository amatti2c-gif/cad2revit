# =============================================================================
#  CORRESPONDENCIA CAD -> REVIT  —  input del proyectista
# =============================================================================
#  Las capas se describen con expresiones regulares (sin distinguir mayúsculas
#  si empiezas con (?i)). Adapta esto al estándar de capas de tu oficina.
# =============================================================================

capas:
  muros:      "(?i)^(A-)?MUR|WALL|TABIQ"
  puertas:    "(?i)PUERTA|DOOR"
  ventanas:   "(?i)VENTANA|WINDOW|VENT"
  columnas:   "(?i)COLUMN|PILAR|S-COL"
  losas:      "(?i)LOSA|SLAB"
  ejes:       "(?i)EJE|GRID"
  recintos:   "(?i)RECINTO|ROOM|NOMBRE"
  niveles:    "(?i)NIVEL|NPT|LEVEL"     # en elevaciones/cortes

# Reconocimiento geométrico de muros (líneas paralelas)
deteccion_muros:
  espesor_min: 0.05
  espesor_max: 0.40
  largo_min: 0.20                # descarta trazos más cortos
  tolerancia_angulo_grados: 1.0
  vano_max: 3.0                  # une tramos colineales separados por vanos
                                 # de hasta este largo (puertas/ventanas)

# Unidad del dibujo: m | cm | mm  (auto = lee $INSUNITS del DXF)
unidades: auto

# Texto de nivel en elevaciones. El grupo 1 debe capturar la cota.
patron_nivel: "(?i)(?:N\\.?P\\.?T\\.?|NIVEL|N\\.?)\\s*([+-]?\\d+(?:[.,]\\d+)?)"

# -----------------------------------------------------------------------------
#  BLOQUES -> FAMILIAS
# -----------------------------------------------------------------------------
#  Se evalúan en orden. "bloque" es expresión regular sobre el nombre del
#  bloque. ancho/alto/antepecho en metros; si ancho se omite, se mide del
#  bloque en planta.
bloques:
  # Familias de la plantilla métrica de Revit 2027. Si el ancho/alto no coincide con un
  # tipo existente, el complemento duplica el tipo más cercano con las medidas indicadas.
  - {bloque: "(?i)P(UERTA)?[-_]?90",  categoria: puerta,  familia: "M_Door-Passage-Single-Flush", tipo: "900 x 2100mm", ancho: 0.90, alto: 2.10}
  - {bloque: "(?i)P(UERTA)?[-_]?80",  categoria: puerta,  familia: "M_Door-Passage-Single-Flush", tipo: "900 x 2100mm", ancho: 0.80, alto: 2.10}
  - {bloque: "(?i)P(UERTA)?[-_]?70",  categoria: puerta,  familia: "M_Door-Passage-Single-Flush", tipo: "750 x 2100mm", ancho: 0.70, alto: 2.10}
  - {bloque: "(?i)V(ENTANA)?[-_]?\\d+", categoria: ventana, familia: "M_Window-Fixed",            tipo: "900 x 1200mm", alto: 1.20, antepecho: 0.90}
  - {bloque: "(?i)COL|PILAR",          categoria: columna}

# -----------------------------------------------------------------------------
#  PUERTAS / VENTANAS EN MUROS DELGADOS
# -----------------------------------------------------------------------------
#  Las familias de puerta de la plantilla métrica de Revit 2027 no se pueden
#  colocar en muros de menos de 12,5 cm (Revit: "Profile sketch is empty").
#  En muros más delgados se usa la familia indicada aquí (por ejemplo una puerta
#  para tabiques que hayas cargado en tu plantilla). Si familia queda vacía, se
#  deja solo el vano en el muro.
aberturas_en_muros_delgados:
  puerta:
    espesor_minimo: 0.125
    familia:            # ej. "Puerta Tabique 1 Hoja"
    tipo:
  # ventana:
  #   espesor_minimo: 0.125
  #   familia:
  #   tipo:
