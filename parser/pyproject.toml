[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2revit"
version = "0.1.0"
description = "Planos 2D (DXF/DWG) a modelo intermedio JSON para construir en Revit"
requires-python = ">=3.10"
dependencies = ["ezdxf>=1.1", "shapely>=2.0", "pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cad2revit = "cad2revit.__main__:main"

[tool.setuptools]
packages = ["cad2revit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
